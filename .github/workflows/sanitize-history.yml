name: Sanitize historical database-password template

on:
  workflow_dispatch:
    inputs:
      confirm_rotation:
        description: "Select yes only after reviewing the old template value and rotating the database password if it was ever used."
        required: true
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"

permissions:
  contents: write

concurrency:
  group: sanitize-history-food-order
  cancel-in-progress: false

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: Require review and branch confirmation
        env:
          CONFIRM_ROTATION: ${{ inputs.confirm_rotation }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -Eeuo pipefail
          if [ "$CONFIRM_ROTATION" != "yes" ]; then
            echo "::error::No history changes were made. Review the old password-like template value and rotate the database password first if it was live."
            exit 1
          fi
          if [ "$REF_NAME" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from the main branch only."
            exit 1
          fi

  rewrite:
    needs: confirm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the current template is sanitized
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Eq '^FOOD_ORDER_DB_PASSWORD=$' .env.example
          echo "Current environment template has a blank password value."

      - name: Remove historical template versions and restore the safe template
        shell: bash
        run: |
          set -Eeuo pipefail
          original_head="$GITHUB_SHA"
          cp .env.example "$RUNNER_TEMP/env.example"
          python -m pip install --disable-pip-version-check git-filter-repo
          git filter-repo --force --path .env.example --invert-paths

          cp "$RUNNER_TEMP/env.example" .env.example
          git add .env.example
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "security: restore blank database-password template after history cleanup"

          path_commit_count="$(git rev-list --all -- .env.example | wc -l | tr -d ' ')"
          if [ "$path_commit_count" != "1" ]; then
            echo "::error::Expected only the final safe environment template in history, found $path_commit_count commits touching that path."
            exit 1
          fi

          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
            push --force-with-lease="refs/heads/main:$original_head" origin HEAD:refs/heads/main

          echo "History rewritten and pushed with force-with-lease. Only the current blank-password template remains."
        env:
          GH_TOKEN: ${{ github.token }}
